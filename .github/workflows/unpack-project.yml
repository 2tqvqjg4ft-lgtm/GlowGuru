name: Unpack GlowGuru project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-project.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        shell: bash
        run: |
          rm -rf app
          mkdir -p app
          unzip -o "Проект приложения .zip" -d app
          find app -name "__MACOSX" -type d -prune -exec rm -rf {} + || true

      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack GlowGuru source"
            git push
          fi
