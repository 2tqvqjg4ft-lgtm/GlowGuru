name: Verify GlowGuru

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/verify-glowguru.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Schedule tests
        run: bunx vitest run tests/schedule.test.ts
      - name: Build
        run: bun run build
